name = "mailtion-email-router"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Secrets được set qua CLI (KHÔNG lưu secret thật ở đây):
#   wrangler secret put DASHBOARD_WEBHOOK_URL
#   wrangler secret put WEBHOOK_SECRET
#
# Giá trị thực tế:
#   DASHBOARD_WEBHOOK_URL = "https://mailtion.com/api/webhook/email"
#   WEBHOOK_SECRET        = <khớp với webhook_secret trong Settings của Mailtion>
