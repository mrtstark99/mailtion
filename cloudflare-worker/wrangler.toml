name = "mailtion-email-router"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Secrets được set qua CLI (KHÔNG lưu secret thật ở đây):
#   wrangler secret put DASHBOARD_WEBHOOK_URL
#   wrangler secret put WEBHOOK_SECRET
#
# Giá trị thực tế:
#   DASHBOARD_WEBHOOK_URL = "https://mailtion.com/api/webhook/email"
#   WEBHOOK_SECRET        = <khớp với webhook_secret trong Settings của Mailtion>

[vars]
# Số ngày giữ chỉ mục trong D1; cũ hơn được dồn sang R2 archive/index-YYYY-MM.jsonl
INDEX_DAYS = "30"

# Bản gốc .eml của mọi thư (backup lâu dài, không có lifecycle xoá)
[[r2_buckets]]
binding = "MAIL_BUCKET"
bucket_name = "mailtion-mail-buffer"

# Chỉ mục + trạng thái giao thư (schema.sql)
[[d1_databases]]
binding = "DB"
database_name = "mailtion-buffer"
database_id = "dcc402c3-e014-4835-92b9-7e880f1c3eb2"

[triggers]
# Mỗi phút: đẩy lại thư đang chờ khi Mailtion online.
# 18:00 UTC = 03:00 giờ Tokyo: dồn chỉ mục cũ sang R2 (khớp ARCHIVE_CRON trong src/index.ts).
crons = ["* * * * *", "0 18 * * *"]
